<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <link rel="stylesheet" href="index.css">

    <meta name="description" content="My JS Calculator using HTML, CSS and JS">
    <meta name="keywords" content="HTML, CSS, JS, JAVASCRIPT, BASIC CALCULATOR, CALC">
    <meta name="author" content="MD DILNAWAZ HUSSAIN">
    <meta name="robots" content="index, follow">
</head>

<body>

    <div class="parent">

        <div class="calc">

            <form>

                <div class="upper">
                    <input class="displaycalc" type="text">
                </div>
            </form>
            <div id="buttons">

                <button class="ope clear">AC</button>
                <button class="ope one_clear">DC</button>
                <button class="operator ope">%</button>
                <button class="operator ope op fontbig">/</button>

                <button class="num">7</button>
                <button class="num">8</button>
                <button class="num">9</button>
                <button class="operator ope op">*</button>

                <button class="num">4</button>
                <button class="num">5</button>
                <button class="num">6</button>
                <button class="operator ope op fontbigx">-</button>

                <button class="num">3</button>
                <button class="num">2</button>
                <button class="num">1</button>
                <button class="operator ope op fontbigx">+</button>

                <button class="num">00</button>
                <button class="num">0</button>
                <button class="operator fontbigx">.</button>
                <button class="sum fontbigx red">=</button>

            </div>



        </div>

    </div>

    <script src="index.js"></script>

</body>

</html>
